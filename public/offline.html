<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07090d" />
  <title>Wova8 CRM — Offline</title>
  <style>
    html,body{height:100%;margin:0;background:#07090d;color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    section{max-width:520px;border:1px solid #20242e;border-radius:24px;background:#0d1016;padding:32px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#8b7cff,#6d5dfc 55%,#14b8a6);font-weight:900}
    h1{font-size:28px;letter-spacing:-.04em;margin:22px 0 8px}p{color:#94a3b8;line-height:1.65;margin:0}button{margin-top:22px;border:0;border-radius:12px;background:#6d5dfc;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main><section><div class="mark">W</div><h1>You’re offline</h1><p>Wova8 CRM does not cache private customer pages for offline viewing. Reconnect to the internet, then retry.</p><button onclick="location.reload()">Try again</button></section></main></body>
</html>
